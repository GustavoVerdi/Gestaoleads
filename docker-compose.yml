services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "4173"
      GOOGLE_MAPS_SCRAPER_URL: http://scraper:8080
    ports:
      - "127.0.0.1:${APP_PORT:-4174}:4173"
    depends_on:
      - scraper

  scraper:
    image: gosom/google-maps-scraper:latest
    restart: unless-stopped
    command: ["-data-folder", "/gmapsdata"]
    volumes:
      - scraper-data:/gmapsdata

volumes:
  scraper-data:
